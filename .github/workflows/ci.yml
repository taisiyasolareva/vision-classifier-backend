name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: make lint

      - name: Type check
        run: make type-check

      - name: Tests + coverage
        run: pytest tests/ -v --cov=src/cv200 --cov-report=xml


